<!DOCTYPE html>
<html lang="en">
<head>
  <script>document.documentElement.classList.add('js')</script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Experience Gallery — MAB WONDERLUST SAFARIS</title>
  <meta name="description" content="Photo gallery for our African travel experiences: safari & wildlife, culture & heritage, nature & adventure, conservation, indigenous journeys and customized travel.">
  <meta property="og:title" content="Experience Gallery — MAB WONDERLUST SAFARIS">
  <meta property="og:description" content="Photo galleries for each of our African travel experiences.">
  <meta property="og:type" content="website">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" type="image/png" href="assets/logo/ChatGPT Image Sep 15, 2026, 10_46_48 AM.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/responsive.css">
</head>
<body class="gallery-viewer-body">

  <div class="grain-overlay" aria-hidden="true"></div>

  <header class="gallery-viewer-bar">
    <a href="experiences.html" class="gallery-back">
      <i class="bi bi-arrow-left" aria-hidden="true"></i>
      <span>All Experiences</span>
    </a>
    <p class="gallery-viewer-brand">MAB WONDERLUST</p>
  </header>

  <main id="main-content" class="gallery-viewer-main">
    <div class="gallery-viewer-head">
      <p class="gallery-number" id="viewerNumber">01 &mdash;</p>
      <h1 class="gallery-title" id="viewerTitle">Loading</h1>
      <p class="gallery-desc" id="viewerDesc"></p>
    </div>
    <div class="gallery-grid" id="viewerGrid"></div>
    <p class="gallery-empty" id="viewerEmpty" hidden>No photos in this collection yet.</p>
  </main>

  <script>
  (function () {
    var IMG = 'assets/images/';

    var GALLERIES = {
      'safari-wildlife': {
        number: '01',
        title: 'Safari &amp; Wildlife',
        desc: 'Track the Big Five across Kenya’s greatest reserves. From the Great Migration in the Maasai Mara to elephant herds beneath Kilimanjaro, every drive is guided by trackers who read the land like a story.',
        photos: [
          { file: 'wild safaris.jpg', alt: 'Wildlife on safari in Kenya', wide: true },
          { file: 'maasai mara.jpg', alt: 'Maasai Mara savannah' },
          { file: 'serengeti.jpg', alt: 'Serengeti plains' },
          { file: 'amboseli.jpg', alt: 'Elephants beneath Mount Kilimanjaro' },
          { file: 'tsavo.jpg', alt: 'Tsavo wilderness' },
          { file: 'ngorongoro.jpg', alt: 'Ngorongoro Crater', wide: true },
          { file: 'okavango.jpg', alt: 'Okavango Delta' },
          { file: '1000393211.jpg', alt: 'Elephants on the savannah' }
        ]
      },
      'culture-heritage': {
        number: '02',
        title: 'Culture &amp; Heritage',
        desc: 'Step inside living traditions — meeting beadwork and carving cooperatives, sharing meals with Maasai and Samburu families, and listening to stories carried across generations.',
        photos: [
          { file: '1000393214.jpg', alt: 'Community and cultural heritage', wide: true },
          { file: '1000467085.jpg', alt: 'People of Kenya' },
          { file: '1000393213.jpg', alt: 'Kenyan landscape and people' }
        ]
      },
      'nature-adventure': {
        number: '03',
        title: 'Nature &amp; Adventure',
        desc: 'From the thunder of Victoria Falls to gorilla trekking in Bwindi’s ancient rainforest. Active days, rare landscapes, and the kind of scenery you never stop photographing.',
        photos: [
          { file: 'victoria falls.jpg', alt: 'Victoria Falls', wide: true },
          { file: 'bwindi.jpg', alt: 'Bwindi Impenetrable Forest' },
          { file: '1000393215.jpg', alt: 'Mountain adventure' },
          { file: 'capetown.jpg', alt: 'Cape Town and Table Mountain' }
        ]
      },
      'conservation-community': {
        number: '04',
        title: 'Conservation &amp; Community',
        desc: 'Travel that gives back. Every journey with us supports the people who call these landscapes home and the projects protecting Kenya’s natural heritage for the next generation.',
        photos: [
          { file: '1000393214.jpg', alt: 'Community conservation project', wide: true },
          { file: '1000393212.jpg', alt: 'Landscape supported by conservation' },
          { file: 'tsavo.jpg', alt: 'Protected wilderness' }
        ]
      },
      'indigenous-spiritual': {
        number: '05',
        title: 'Indigenous &amp; Spiritual Journeys',
        desc: 'Quiet, respectful encounters with spiritual traditions and ancestral wisdom — dawn rituals, sacred landscapes, and guides who share the meaning behind what you see.',
        photos: [
          { file: '1000467085.jpg', alt: 'People and tradition', wide: true },
          { file: '1000393213.jpg', alt: 'Sacred landscape' },
          { file: '1000393211.jpg', alt: 'Wildlife and ancient land' }
        ]
      },
      'customized-travel': {
        number: '06',
        title: 'Customized Travel',
        desc: 'Your journey, designed around you. Private vehicles, flexible pacing, and routes built around what you love — from a weekend escape to a three-week expedition across the continent.',
        photos: [
          { file: '1000393212.jpg', alt: 'Scenic landscape', wide: true },
          { file: 'okavango.jpg', alt: 'Okavango Delta by canoe' },
          { file: 'maasai mara.jpg', alt: 'Maasai Mara' },
          { file: 'victoria falls.jpg', alt: 'Victoria Falls' }
        ]
      }
    };

    var ORDER = ['safari-wildlife', 'culture-heritage', 'nature-adventure',
                 'conservation-community', 'indigenous-spiritual', 'customized-travel'];

    var grid = document.getElementById('viewerGrid');
    var emptyMsg = document.getElementById('viewerEmpty');
    var numEl = document.getElementById('viewerNumber');
    var titleEl = document.getElementById('viewerTitle');
    var descEl = document.getElementById('viewerDesc');

    function render(slug) {
      var data = GALLERIES[slug];

      if (!data) {
        titleEl.textContent = 'Collection not found';
        descEl.textContent = 'Head back to experiences and choose a category.';
        numEl.textContent = '—';
        emptyMsg.hidden = true;
        grid.innerHTML = '';
        return;
      }

      document.title = data.title.replace(/&amp;/g, '&') + ' — MAB WONDERLUST SAFARIS';
      numEl.innerHTML = data.number + ' &mdash;';
      titleEl.innerHTML = data.title;
      descEl.textContent = data.desc.replace(/&rsquo;/g, '\u2019');

      if (!data.photos.length) {
        emptyMsg.hidden = false;
        grid.innerHTML = '';
        return;
      }

      emptyMsg.hidden = true;
      grid.innerHTML = data.photos.map(function (p) {
        return '<figure class="gallery-item' + (p.wide ? ' gallery-item-wide' : '') + '">' +
               '<img src="' + IMG + p.file + '" alt="' + p.alt + '" loading="lazy">' +
               '</figure>';
      }).join('');
    }

    function currentSlug() {
      var raw = (window.location.hash || '').replace(/^#/, '');
      return decodeURIComponent(raw).toLowerCase();
    }

    window.addEventListener('hashchange', function () {
      render(currentSlug());
    });

    render(currentSlug());
  })();
  </script>
</body>
</html>
